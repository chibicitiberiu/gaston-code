# Tool configuration, and -- since the release build -- a package definition.
#
# This file used to say "tool configuration only. The bridge is run from the
# source tree and has no build step". That was true and is still how it is
# developed: nothing below changes `make lint`, `make test-fast` or running
# `python -m bridge.server` out of a checkout. What it adds is the ability to
# INSTALL the bridge, which is now the whole host-side release: one
# py3-none-any wheel, installed with pipx or `uv tool install`, with
# `gaston-bridge` as the console script the user runs.
#
# The guest side is not here and never will be: it is C++98 built by Open
# Watcom, packaged by tools/gen/mkrelease.sh.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gaston-code-bridge"
# One spelling of the version for the HOST side. The guest's lives in
# win/app/resource.h, because that is what the linker stamps into the image,
# and tools/gen/mkrelease.sh refuses a mismatch between it and the tag. These
# two are released together and carry the same number.
version = "0.4.0"
description = "The modern-host half of Gaston Code: runs Claude Code and speaks the wire protocol to a Windows 98 client"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Tiberiu Chibici" }]
keywords = ["claude", "windows98", "retrocomputing", "agent"]

# The same two direct dependencies as requirements.in. A LIBRARY that pins
# its transitives cannot be installed beside anything, so the transitives
# stay unpinned here -- but this is an APPLICATION that lives in its own
# pipx venv, and the SDK is not a transitive. It gets an upper bound.
#
# THE BOUND IS LOAD-BEARING, not tidiness. bridge/claudecli.py warns when
# the user's Claude Code is older than the SDK was built against, reading
# claude_agent_sdk._cli_version.__cli_version__. Unbounded, that threshold
# is whatever PyPI served the morning each user installed: 0.2.153 says
# 2.1.273 and 0.2.174 says 2.1.310, so two people months apart get
# different answers from the same release.
#
# Claude Code itself is NOT carried. The SDK's platform wheels bundle it;
# the install line in docs/GUIDE.md asks for the sdist instead, so the CLI
# the user installed is the one that runs. See requirements.in.
dependencies = [
    "claude-agent-sdk>=0.2.153,<0.3",
    "pillow>=12.0",
]

[project.urls]
Homepage = "https://github.com/chibicitiberiu/gaston-code"
Source = "https://github.com/chibicitiberiu/gaston-code"

[project.scripts]
gaston-bridge = "bridge.server:main"

[tool.setuptools]
# FALSE, or `packages` does not mean what it says. The default is true,
# which sweeps anything in the sdist that sits under a listed package in as
# package DATA -- so bridge/devtools, deliberately left out of `packages`
# below, arrived in the wheel anyway as files belonging to `bridge`. The
# .toml runtime data is named explicitly in `package-data`, so nothing here
# depends on the sweep.
include-package-data = false
# Named rather than discovered. Auto-discovery at this repository's root
# finds `tests`, `tools`, `research` and `vm` and tries to package them.
# NOT `bridge.devtools`, and that is a security decision rather than a
# tidiness one. fakegui.py is a complete wire client with PREFS and
# PERMREPLY -- which is to say, exactly the tool needed to send a
# policy-rewriting handshake to a bridge whose secret somebody has. Both
# ends of that are now closed (bridge/server.py refuses an outward bind on
# the shipped secret), but shipping the client for it in every install
# would be handing it out prebuilt.
#
# NOT `gremote` either: it is the HOST-side driver for the guest's remote
# server, used from a checkout by tests and research, and a bridge user has
# no call for it. It is also a plain top-level name, which is the more
# collidable of the two.
#
# Both stay in the source tree. This drops them from the INSTALL.
packages = [
    "bridge",
    "bridge.agent",
    "bridge.files",
    "bridge.services",
    "bridge.view",
    "bridge.wire",
    # No __init__.py in either, so they are not importable packages and
    # nothing imports them -- but setuptools sees a directory of files under
    # a package and warns "would be ignored" on every build unless they are
    # named. Listed here so that warning is gone and a real one is visible.
    "bridge.profiles",
    "bridge.prompts",
]

[tool.setuptools.package-data]
# The shell grammars and the prompt text are DATA the bridge reads at
# runtime, not documentation: bridge/agent/profiles.py and prompts.py both
# resolve `Path(__file__).parent.parent / <dir>`, so these files have to be
# installed beside the package or every tool profile and every system prompt
# is missing and the failure is a confusing empty inventory rather than an
# import error.
"bridge.profiles" = ["*.toml"]
"bridge.prompts" = ["*.toml"]

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = [".venv", "vm", "build", "tests/python/.wineprefix"]

[tool.ruff.lint]
select = [
    "F",      # pyflakes -- undefined names, unused imports, dead locals
    "E", "W", # pycodestyle
    "I",      # import ordering
    "B",      # bugbear -- mutable defaults, shadowed loop vars
    "UP",     # pyupgrade
    "SIM",    # simplifiable constructs
    "TC",     # typing-only imports in the wrong place
    "ASYNC",  # blocking calls in async code -- this codebase is all asyncio
    "RUF",
]
ignore = [
    # The codebase logs with %-style deliberately: the formatting is deferred
    # to the handler, so a message that is never emitted is never built.
    "UP031", "UP032",
    # `except Exception` at a task boundary is how a background task reports
    # instead of dying silently -- audit 02.13. Each one is deliberate.
    "BLE001",
    "E501",   # long lines are mostly prose in comments; W505 is not enabled
    # Moving imports into `if TYPE_CHECKING` is how three annotations in
    # guest.py became unresolvable strings that nothing could check. The
    # runtime cost of a real import here is nil; TC005 (an EMPTY block) stays
    # on, because that one only ever finds leftovers.
    "TC001", "TC003",
    # Blocking `os.path` stats in async functions. MEASURED on this box:
    # os.path.isfile is 2.4us, and the same call through asyncio.to_thread is
    # 531us -- 220x slower. The event loop serves one guest on a link the
    # project sizes at 5 KB/s; a 2us stat is five orders of magnitude below
    # the thing it is waiting for, and moving it to a thread would cost more
    # than it saves. ASYNC230 (opening and READING a file, which can be
    # megabytes) stays on.
    "ASYNC240",
    # `class X(str, Enum)` rather than `StrEnum`. Deliberate and repo-wide:
    # `bridge/status.py` documents that `str()` on a `(str, Enum)` member is
    # "PromptEndReason.TIMEOUT", not "timeout", which is exactly why every
    # site that puts one on the wire passes `.value` explicitly. StrEnum
    # would silently make the bare member work too, and the next header
    # written without `.value` would be wrong in a way nothing catches.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
# Profiles and prompts are data; the fakegui is a harness, not the product.
"bridge/devtools/*" = ["ASYNC", "SIM"]
"tests/**" = [
    "B", "SIM", "ASYNC",
    # `from harness import harness` then `def test_x(harness)` is how pytest
    # fixtures are shared. The parameter shadows the import by design; ruff
    # reads it as a redefinition. 258 of them, none a defect.
    "F811",
    # conftest-style tests set sys.path before importing the package.
    "E402",
]
# fold.py's table is ABOUT confusable and invisible characters -- flagging
# them there is flagging the subject matter.
"bridge/wire/fold.py" = ["RUF001", "RUF002", "RUF003"]
# ... and its test, which feeds it smart quotes, an NBSP, an en dash and a
# Cyrillic look-alike on purpose.
"tests/python/wire/test_fold.py" = ["RUF001", "RUF002", "RUF003"]
# The sync pass reads one file per path, capped at MAX_FILE (1MB), and they
# are files the bridge itself just wrote or scanned, so they are warm.
# MEASURED: 130us inline against 735us through asyncio.to_thread -- a
# hundred-file pass is 13ms inline and 74ms threaded. ASYNC230 stays on
# everywhere else, and what it found there was real: the attachment read is
# user-chosen, up to 10MB and probably cold, so that one did move off.
"bridge/files/syncrun.py" = ["ASYNC230"]

[tool.mypy]
python_version = "3.11"
files = ["bridge", "gremote"]
ignore_missing_imports = true      # claude_agent_sdk and PIL ship no stubs
warn_unused_ignores = true
warn_redundant_casts = true
# Deliberately NOT `disallow_untyped_defs` yet: it would report several
# hundred at once and none of them is a defect. The rules that find real
# defects are on; the annotation debt is a separate, later pass.
