[pytest]
testpaths = tests/python

# The repo root, so `import bridge...` works; and tests/python, so the suites
# can `import conftest` from inside a layer folder. Without the second, the
# default import mode puts only the test file's OWN directory on the path --
# so `tests/python/agent/test_machine.py` can see `agent/`, not `conftest`.
pythonpath = . tests/python
asyncio_mode = auto

# Unregistered marks are an error, not a warning. A typo'd mark is silently
# inert otherwise, and an inert `guest` mark means a Wine suite quietly
# rejoins the fast run and slows it down -- or worse, quietly leaves it.
addopts = --strict-markers --strict-config

# Fail on warnings (DeprecationWarning, RuntimeWarning: unawaited coroutines),
# while ignoring benign Python 3.14 unclosed-file ResourceWarnings in test helpers.
filterwarnings =
    error
    ignore::ResourceWarning
    ignore::pytest.PytestCacheWarning

markers =
    guest: runs the SHIPPING guest C under Wine. Needs Open Watcom and the
        Lutris wine-ge runner, and costs ~90% of the suite's wall time (144
        tests, ~156s, against ~15s for the other 2500). `make test-fast`
        deselects these; `make wine-smoke` runs only these.
