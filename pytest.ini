[pytest]
testpaths = tests/python
pythonpath = .
asyncio_mode = auto

# Unregistered marks are an error, not a warning. A typo'd mark is silently
# inert otherwise, and an inert `guest` mark means a Wine suite quietly
# rejoins the fast run and slows it down -- or worse, quietly leaves it.
addopts = --strict-markers

markers =
    guest: runs the SHIPPING guest C under Wine. Needs Open Watcom and the
        Lutris wine-ge runner, and costs ~90% of the suite's wall time (144
        tests, ~156s, against ~15s for the other 2500). `make test-fast`
        deselects these; `make wine-smoke` runs only these.
