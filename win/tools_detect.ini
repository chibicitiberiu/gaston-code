; What to look for on this machine. Gaston Code reads this at connect and
; reports WHICH OF THESE EXIST to the bridge, which decides what they mean.
;
; The guest looks; the bridge interprets. That split is deliberate and it is
; why this file has no rules in it -- no "if the env var is set use that,
; otherwise walk up two directories". Those live on the bridge, in Python,
; where they can be changed without rebuilding this program and tested
; without a Windows machine. Here there are only two questions: what is the
; value of this environment variable, and does this file exist.
;
; EDIT THIS FILE if something is installed that is not listed. The client
; replaces it on every install -- put your own additions in TOOLS.INI beside
; it instead, which is never overwritten and is read second.
;
;   [section]        a name the bridge knows. Free text; if the bridge has no
;                    rule for it, it is reported and listed and nothing more.
;   env1..env8       environment variables to report the value of.
;   file1..file8     files to report the existence of. Absolute.
;
; Nothing here is a promise that the thing is installed. A hit means the file
; is there, which is evidence and not proof -- the bridge says so when it
; tells the assistant.
;
; PATHS HERE ARE LONG NAMES, NEVER 8.3 ALIASES (the `PROGRA~1`,
; `DEVSTU~1` style). An alias is assigned in creation order on the disk it
; was created on and cannot be guessed from a different machine. Found
; 2026-10-01 on a real Windows 98 machine with Visual Studio 6 installed:
; `C:\PROGRA~1\DEVSTU~1\VC\BIN\CL.EXE` matched nothing there, while the real
; compiler sat at the long path below, verified present by stat over the
; network. Windows 98's Win32 API resolves long paths fine -- `GetFileAttributesA`
; does not need the short form -- so there is no reason to guess one.

[command.com]
env1=COMSPEC
file1=C:\WINDOWS\COMMAND.COM
file2=C:\COMMAND.COM

[4dos]
file1=C:\4DOS\4DOS.COM
file2=C:\4NT\4NT.EXE

; Open Watcom. Two layouts: 1.9 puts the Win32-hosted tools in BINNT, and
; the DOS-hosted ones in BINW. BINW also holds WLSYSTEM.LNK, which the
; linker reads on every single link regardless of target.
[watcom]
env1=WATCOM
env2=INCLUDE
file1=C:\WATCOM\BINNT\WCC386.EXE
file2=C:\WATCOM\BINW\WCC386.EXE
file3=C:\WATCOM\BINNT64\WCC386.EXE
file4=C:\OW\BINNT\WCC386.EXE

; Turbo C predates the registry and was never on PATH by default. 2.01
; installs flat, 3.x uses BIN\.
[turboc]
file1=C:\TC\BIN\TCC.EXE
file2=C:\TC\TCC.EXE
file3=C:\TURBOC\TCC.EXE

[borlandc]
file1=C:\BORLANDC\BIN\BCC.EXE
file2=C:\BC5\BIN\BCC32.EXE
file3=C:\BC45\BIN\BCC32.EXE

[msvc]
env1=MSVCDIR
file1=C:\MSVC\BIN\CL.EXE
file2=C:\MSDEV\BIN\CL.EXE
file3=C:\Program Files\DevStudio\VC\BIN\CL.EXE
file4=C:\Program Files\Microsoft Visual Studio\VC98\Bin\CL.EXE
file5=C:\Program Files\Microsoft Visual Studio\VC98\Bin\LINK.EXE
file6=C:\Program Files\Microsoft Visual Studio\Common\MSDev98\Bin\MSDEV.EXE

[djgpp]
env1=DJGPP
file1=C:\DJGPP\BIN\GCC.EXE

[turbopascal]
file1=C:\TP\BIN\TURBO.EXE
file2=C:\TP\TURBO.EXE

[masm]
file1=C:\MASM\BIN\ML.EXE
file2=C:\MASM611\BIN\ML.EXE

[tasm]
file1=C:\TASM\BIN\TASM.EXE

[qbasic]
file1=C:\WINDOWS\COMMAND\QBASIC.EXE
file2=C:\DOS\QBASIC.EXE

[pkzip]
file1=C:\PKZIP\PKZIP.EXE
file2=C:\WINDOWS\COMMAND\PKZIP.EXE

[debug]
file1=C:\WINDOWS\COMMAND\DEBUG.EXE

[cscript]
file1=C:\WINDOWS\COMMAND\CSCRIPT.EXE
file2=C:\WINDOWS\CSCRIPT.EXE
file3=C:\WINDOWS\SYSTEM\CSCRIPT.EXE
file4=C:\WINNT\SYSTEM32\CSCRIPT.EXE
file5=C:\WINDOWS\SYSTEM32\CSCRIPT.EXE
file6=C:\WINDOWS\SYSTEM\WSHCON.DLL
file7=C:\WINNT\SYSTEM32\WSHCON.DLL
file8=C:\WINDOWS\SYSTEM32\WSHCON.DLL

; Sun's JDK. The marker is javac, not java: a JRE-only install has `java`
; and cannot build anything, and the note below is about building.
;
; ONLY 1.1-ERA LAYOUTS ARE LISTED, deliberately. The note this section
; selects is a list of what Java 1.1 does not have, and that note is wrong
; -- confidently, in the direction that costs a compile -- in front of a
; 1.2 or 1.3 install, where half of it came back. A later JDK is better not
; detected at all than described as 1.1; silence here means "nothing
; matched", which is what it should mean.
;
; file1 is this user's machine: Sun Java WorkShop 2.0 keeps its toolchain in
; a JDK\ subdirectory of the product, which is nowhere a standalone JDK
; would land. The rest are the standalone 1.1 defaults.
;
; Only JAVA_HOME is asked for. CLASSPATH was here and is gone: the bridge
; cannot use it as a root (it names jars and class directories, not an
; install), nothing else reads it, and measured 2026-10-01 this machine does
; not set it -- so it was a lookup paid for on a 200MHz disk whose answer
; went nowhere. JAVA_HOME is not set on that machine either, and stays
; because it is THE conventional root variable: it is how a JDK unpacked by
; hand somewhere none of the paths below cover would be found at all.
[jdk]
env1=JAVA_HOME
file1=C:\Java-WorkShop20\JDK\bin\javac.exe
file2=C:\JDK1.1.8\bin\javac.exe
file3=C:\JDK1.1.7\bin\javac.exe
file4=C:\JDK1.1.6\bin\javac.exe
file5=C:\JDK1.1\bin\javac.exe
file6=C:\JAVA\bin\javac.exe
