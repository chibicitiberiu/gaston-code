# What the bridge knows about `cscript`.
#
# ONE FILE PER TOOL under `bridge/profiles/`, named for what the guest reports.
# The client looks and says what it found; everything about what that MEANS is
# here, in data, so it can change without touching Python and without
# reflashing a 1998 PC.

[detect]
kind = "tool"
# No `bins`: the marker file IS the answer. A single program, where
# the path to the program is what anyone wants.

[detect.version]
# WSHCON.DLL (WshController) was introduced with WSH 5.6 for remote scripting.
# If present, WSH 5.6 is installed; otherwise the default Win98 SE install is 5.0.
"WSHCON.DLL" = "5.6"
default = "5.0"

[note]
# Shown to the assistant when this tool is detected. DETECTION MAY
# GUESS; A NOTE MAY NOT -- `measured` says on what machine and what
# version, and a test asserts it is present.
title = "Windows Script Host (CScript)"
measured = "WSH 5.0 (build 5.0.0.4615) on the vm/ Windows 98 SE guest, 2026-09-23"
body = '''
CScript (Windows Script Host {version}) at {root} -- measured on this machine:

  * Run scripts with cscript, NEVER bare or with wscript (which pops modal dialogs):
        {root} //nologo script.vbs [args...]
  * Switches: `//B` (batch mode, suppresses dialogs), `//T:nn` (timeout in seconds).
  * WSH {version} capabilities and limits:
    - VBScript and JScript (.vbs, .js) run out of the box.
    - File system: `Set fso = CreateObject("Scripting.FileSystemObject")`
    - Shell object: `Set sh = CreateObject("WScript.Shell")`
    - In WSH 5.0, `sh.Exec` does NOT exist; use `sh.Run "%COMSPEC% /c cmd > out.txt", 0, True`
      and read out.txt with FileSystemObject to capture stdout.
    - Exit code: `WScript.Quit(exitCode)` returns an errorlevel to the shell.
'''
