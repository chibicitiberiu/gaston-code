# What the bridge knows about `command.com`.
#
# ONE FILE PER TOOL, named for what the guest reports. The client
# looks and says what it found; everything about what that MEANS is
# here, in data, so it can change without touching Python and without
# reflashing a 1998 PC.

[detect]
kind = "shell"
# No `bins`: the marker file IS the answer. A single program, where
# the path to the program is what anyone wants.
# Variables that name the root directly. Reported by the client
# only if it was asked to look at them -- a test asserts these
# appear in the shipped tools_detect.ini.
env = ["COMSPEC"]

# --- how a command written for this shell is read -------------------------
#
# THE GUARD'S TABLES, not the shell's grammar. Nothing here executes
# anything: it decides whether a command can be shown to the user as "this
# reads" or "this writes THERE", and anything it cannot classify is asked
# about. So the safe direction is always to over-match.

[shell]
# Fragments a command might be split on. `&`, `&&` and `||` are NOT
# separators to this shell -- measured on the guest, which answers
# "Too many parameters - &" and runs nothing. They stay in the pattern
# because this is the guard's splitter: splitting on a non-separator can
# only OVER-split, which fails safe, while missing one would let a fragment
# through uninspected.
#
# `\r` and `\n` joined them for exactly that reason (02.10). A newline does
# not chain commands on this shell either, but `split_args` treats it as
# ordinary whitespace, so a leading READ verb hid everything after it:
# "dir\ndel c:\io.sys" came back with no finding at all, because the whole
# thing parsed as one `dir` with some unusual arguments. Over-splitting here
# can only cost extra prompts; missing a line cost the finding.
separators = "&&|\\|\\||[&|\\r\\n]"
redirect_write = "(>>?)\\s*(\\S+)"
redirect_read = "(<)\\s*(\\S+)"
drive = "^[A-Za-z]:"

# A token matching this holds something the bridge cannot expand, so where
# it points is unknown -- which means ASK, not "safe". `%` alone is right
# for this shell: `%PATH%`, `%1`, and a stray `%` are all unresolvable here.
# A shell whose sigil is `$` or `~` says so instead, and the guard stops
# quietly resolving the wrong ones. (It used to be `"%" in token`, in
# Python, which read `del /work/$TARGET/x` as inside the mirror.)
variables = "%"

# How a path is spelled. `altsep` is accepted on input and folded to `sep`:
# everything going through CreateFileA takes `/` as a separator, which is
# also why `switch_max` exists below.
sep = '\'
altsep = '/'
quote = '"'

# Switches, which are not paths. `/windows/system/x` IS a path, so a switch
# carries no separator -- discarding every `/`-prefixed token made a real
# destination invisible, and the guard then reported "writes inside mirror"
# for a command whose target it had thrown away.
#
# `switch_token` IS THE RULE; `switch_max` is only the fallback for a profile
# that declares no vocabulary. Judging by length alone was 02.10: `/io.sys`
# is seven characters with no separator, so `copy c:\gaston\ok\a.txt
# /io.sys` threw the destination away, judged the SOURCE, found it inside the
# mirror and reported the command as fully contained. A switch on this shell
# is a letter or two -- or `?` -- optionally followed by `:value`
# (`/A:-D`, `/F:1.44`), and never contains a dot.
#
# `/TEMP` still matches this, and that is honest: on COMMAND.COM it really is
# both a plausible switch and a real root directory. The guard says so
# instead of guessing -- see `targets` and the "could be a switch or a path"
# answer.
switch = "/"
switch_token = '^/[A-Za-z?][A-Za-z0-9]*(:[^\\/]*)?$'
switch_max = 8

# How this shell is told to run one command line and exit.
#
# The bridge composes `<detected path> <run_switch>` and sends that to the
# guest, which splices it in front of the command and knows nothing else
# about shells. It used to pick between `command.com` and `cmd.exe` itself
# from `GetVersion()` -- so a machine with a second shell installed could not
# be asked to use it, and the guard on this side was judging by a grammar the
# other side might not have been running.
#
# A shell that needs no switch omits this and gets the bare path.
run_switch = "/c"

# How PATH is separated. `;` here because `:` follows a drive letter, which
# is the whole reason the two families differ.
path_sep = ";"

# What a spawned console child writes. NOT the ANSI codepage: this shell's
# children write OEM, so `dir` output is cp437 while a window title from the
# same machine is cp1252. Conflating the two is the classic encoding bug and
# turns a directory listing into mojibake.
oem_codepage = "cp437"

# Extensions that make a leaf a program rather than a builtin, longest-match
# irrelevant here because none is a suffix of another.
exts = [".exe", ".com", ".bat"]

# Verbs that only read.
read = [
  "cd", "chdir", "cls", "comp", "date", "dir", "echo", "fc",
  "find", "findstr", "help", "mem", "more", "path", "pause", "print",
  "rem", "set", "time", "tree", "type", "ver", "vol",
]

# Verbs that write, and whose arguments say where.
write = [
  "copy", "del", "deltree", "edit", "erase", "label", "md", "mkdir",
  "move", "rd", "ren", "rename", "replace", "rmdir", "xcopy",
]

# Two-argument verbs where the LAST path is the destination.
src_dest = [
  "copy", "xcopy",
]

# Verbs that REMOVE their sources as well as writing their destination, so
# every argument but the last is checked a second time.
move_like = [
  "move",
]

# Verbs that only read in SOME forms, so each needs its own test.
conditional_read = [
  "attrib",
]

# Interpreters and shells. Not dangerous -- UNBOUNDED, the same class as an
# unknown program. Listed apart from [shell.always_ask] so a future
# approve-once store can refuse to remember them: one click must never buy a
# permanent grant of arbitrary execution.
unbounded = [
  "basic", "cmd", "cmd.exe", "command", "command.com", "cscript", "perl", "perl.exe",
  "python", "python.exe", "qbasic", "qbasic.exe", "tclsh", "wish", "wscript",
]

# Reserved device names. Reserved in EVERY directory and with ANY extension,
# so a path inside the mirror can still name one -- and then the write does
# not land in the mirror at all.
devices = [
  "aux", "clock$", "com1", "com2", "com3", "com4", "com5", "com6",
  "com7", "com8", "com9", "con", "lpt1", "lpt2", "lpt3", "lpt4",
  "lpt5", "lpt6", "lpt7", "lpt8", "lpt9", "nul", "prn",
]

# Always ask, whatever the arguments, for one of two reasons: the damage is
# not named by any argument, or the command changes what a path MEANS and so
# invalidates every later verdict. The value is what the user is told.
[shell.always_ask]
format = "reformats a volume"
fdisk = "rewrites the partition table"
sys = "rewrites boot sectors and system files"
debug = "can write raw sectors from a script"
recover = "destroys a directory into FILE0001.REC"
scandisk = "rewrites filesystem metadata"
chkdsk = "can rewrite filesystem metadata"
defrag = "rewrites the whole volume layout"
scanreg = "rewrites the registry from a backup"
ctty = "redirects the console device"
mode = "reconfigures devices"
subst = "changes what a drive letter means, so later answers about paths stop being true"
join = "grafts a volume under a directory, so later answers about paths stop being true"
assign = "remaps drive letters"
smartdrv = "enables write-behind caching"
regedit = "imports registry changes"
start = "launches a program detached from the timeout"

# The form in which a `conditional_read` verb actually WRITES. `attrib x`
# reports; `attrib -r x` sets. While this regex was in Python,
# `conditional_read` could only ever hold verbs that happen to use DOS
# attribute letters. Matched case-insensitively.
[shell.write_if]
attrib = "[-+][RSHA]"

# The form in which an `always_ask` verb only READS, and so is not worth
# nagging about. These were `if stem == "fdisk" and "/STATUS" in upper` in
# Python -- a command name and a switch syntax, hardcoded, two lines below a
# comment explaining that command names live in profiles.
[shell.safe_if]
fdisk = "/STATUS"

# The inverse: an `always_ask` verb that only writes in ONE form, so every
# other form is a read. CHKDSK reports unless it is given /F.
[shell.ask_only_if]
chkdsk = "/F"

[note]
# Shown to the assistant when this tool is detected. DETECTION MAY
# GUESS; A NOTE MAY NOT -- `measured` says on what machine and what
# version, and a test asserts it is present.
title = "COMMAND.COM"
measured = "Windows 98 SE 4.10.2222 on the vm/ guest, 2026-09-20"
body = '''
The shell is COMMAND.COM, which is not cmd.exe. Every line below was
measured on this machine, mostly by an agent getting it wrong first:

  * One command, one line. `&`, `&&`, `||` and a newline are not separators;
    the complaint varies ("Too many parameters - &", "Syntax error") and
    `call x.bat && y` is the silent case -- no output, no error, `y` never
    ran. For several steps write a .bat into the mirrored folder and run it.
  * No `2>&1`: it creates a file literally named `&1`, and a following
    `| more` eats the rest of the output.
  * `start prog.exe` returns instantly with no output whether it ran,
    crashed, or does not exist. You cannot see a window -- do not report one.
  * A running .exe is locked: "Permission denied" from the linker, "Access
    denied" from `del`, and `attrib` shows nothing wrong. Ask the user to
    close it.
'''
