# Execution modes: what the classifier (bridge/agent/categories.py) says about
# a call, and what the policy (bridge/agent/policy.py) tells the person and
# the agent. Rules are SHORT: the bar gives a tag a few dozen characters, and
# the checker reads them as evidence.

[rule]
in_work = "{path} is in the work folder"
elsewhere = "{path} is outside the work folder"
protected = "{path} is a protected place ({pattern})"
unresolved = "{path} cannot be placed, so it may be anywhere"
work_root = "{path} is the work folder itself"
sync_rules = "{path} decides what syncs"
gaston = "{path} is inside .gaston, which belongs to the sync layer"
share = "{path} is on another computer"
no_destination = "{program} with no destination that can be placed"
bulk_delete = "{path}: a delete through the shell cannot be undone"
permanent = "{path} is deleted without the Recycle Bin"
danger = "{program}: {why}"
safe_form = "{program} in a form that only reads"
unbounded = "{program} runs whatever it is given"
machine_state = "{program} changes a machine setting"
reads = "{program} only reads"
reads_file = "reads {path}"
state = "lists what the machine has"
no_grammar = "this bridge has no rules for the {shell} shell"
unlisted = "the folder {folder} could not be listed"
runs_elsewhere = "{program} runs in {folder}, outside the work folder"
untrusted = "{program} is not on the trusted list"
trusted = "{program} is a trusted program"
arg_protected = "names {path}, a protected place ({pattern})"
arg_elsewhere = "names {path}, outside the work folder"
built = "{program} is in the work folder, so it was made here"
script = "{program} is a script in the work folder"
too_deep = "{program} calls scripts too deeply to follow"
unread = "{program} could not be read"
bridge_read = "reads the bridge's copy of the work folder"
bridge_shell = "runs a command on the bridge computer"
web = "uses the internet"
screen_see = "looks at the screen"
screen_drive = "clicks and types on the screen"
kill = "ends process {pid}"
sync_resolve = "settles a sync conflict in the work folder"
