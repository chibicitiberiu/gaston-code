# What the model is told each tool is for.
#
# These ship on EVERY request, so they are the most expensive prose in the
# project and the most load-bearing. No operating system and no shell is
# named in any of them: the schema goes to every machine, and which shells
# exist is a fact about one -- the system prompt names them from what that
# machine reported (see bridge/prompts/machine.toml and audit 02.5).


[exec]
description = '''
Run a command on the connected machine (the old computer the user is sitting at), and return its output. By default the command runs through the system shell, whichever that machine has. Output is captured as the console codepage and capped at 32KB. The user must approve every call on their own screen, so prefer one command that answers the question over several that explore.

ONE COMMAND PER CALL. Whether commands can be chained, and with what, depends on the shell that machine has -- the system prompt says which one it is and what it accepts. To run several steps regardless of shell, write a script file into the mirrored folder and run that; it is also one approval instead of several.

IMPORTANT: the command must be non-interactive. Anything that stops to ask a question -- a delete or a format asking 'Are you sure (Y/N)?' -- will HANG until the timeout kills it: that prompt is read from the machine's own console and there is no way to answer it from here -- NOT by piping one in either, which was measured and does not work. Use a form that does not ask: a switch that says yes, or a more specific target.'''

[exec.args]
command = '''
The command line to run, written for the target machine's own shell and path conventions -- the system prompt says what those are.'''
timeout_ms = '''
How long to allow, in milliseconds. Default {default_timeout_ms}, clamped to {max_timeout_ms}. The machine is slow; a compile may genuinely need minutes.'''
shell = '''
Which of the connected machine's shells to run the command through. The system prompt lists the ones it has; omit this to use the first of them. Pass "none" to spawn a program directly instead, which gives cleaner quoting but loses built-ins, pipes and redirection.'''
cwd = '''
Working directory on the connected machine. Optional -- leave it out and the command runs in this conversation's own folder on that machine, which is where your files arrive.'''

# Added to a result, not the tool description: read only when they apply.
[exec.notes]
# A command that failed to start when the machine reported no shell, so it
# was spawned as a program: `ver` fails with nothing saying why otherwise
# (BACKLOG 17).
no_shell = '''
The machine reported no shell, so this ran as a program directly: shell built-ins (dir, ver, copy) and redirection cannot work. Name a program by its path.'''

[sync_status]
description = '''
Report the state of file synchronisation with the connected machine: which of your files could not be copied there and why, which are in conflict, and which are currently refusing your writes.

Read this when a file you wrote does not seem to have arrived, before concluding that it did. Writing a file always succeeds here; whether it reached the user's machine is a separate question and this is the only way to answer it. Read-only and cheap to call.'''

[sync_resolve]
description = '''
Resolve one halted synchronisation decision, after the user has confirmed they are finished with the file.

When you and the user both change the same file, their copy wins and yours is moved aside -- and the path then REFUSES your writes, mechanically, until this is called. That is deliberate: you cannot usefully react to a conflict during the turn in which it happened, so the bridge stops you rather than asking you to stop.

Do not call this to make an error go away. Call it once you have read the preserved copy, merged what you need, and the user has said they have finished with the file. The user approves every call on their own screen.'''

[sync_resolve.args]
action = '''
release (default) -- lift the write refusal on this path, having merged; accept-revert -- the user really did undo your change, so take their version and discard yours; accept-tree -- answers a whole-pass refusal, takes no path; forget -- stop tracking a path that is gone from both sides and should not come back.'''

[ui]
description = '''
Read the controls on the machine's screen: windows, buttons, text boxes, menus, and what they say. Returns one line per control with a `sel=` selector you pass to `click` and `keys`.

Prefer this over `shot`. It is far cheaper, it is exact, and it gives you something you can click; a picture gives you neither a name nor a guarantee. Reach for `shot` when this comes back with almost nothing, which means the program draws itself rather than using controls.

Start with `scope="foreground"` -- the window the person is looking at -- and widen to `desktop` only when you need to find something else.'''

[ui.args]
scope = '''
`foreground` for the active window and its controls, `desktop` for everything on screen, or `pid` with a process id. Default `desktop`.'''
pid = '''
With `scope="pid"`, the process to read. From the process list.'''
max_nodes = '''
Stop after this many controls. Default 400. A busy desktop is around 80; a file list can be thousands, and reading all of them is slow and rarely what you wanted.'''
msaa = '''
Also ask the accessibility layer for each control's name, state and default action. OFF by default and worth leaving off: it is a separate call into another program per control and costs roughly as much as everything else put together. Turn it on when you need to know whether a checkbox is ticked, or when a control has no text of its own.'''
hidden = '''
Include windows that are not on screen. Off by default, and not merely for speed: asking about a hidden window can bring it to life -- the Start menu once ended up painted on screen with nothing owning it.'''
wait_for = '''
A selector to wait for before reading. Use this instead of reading, finding nothing, and reading again: the machine is slow and a dialog may take a second to appear. Waits on the change feed rather than polling, so it costs almost nothing.'''
wait_ms = '''
How long `wait_for` may wait, in milliseconds. Default 5000.'''
settle_ms = '''
Wait for the screen to stop changing for this many milliseconds before reading. Useful right after a click, while a window is still being drawn. Costs nothing -- it watches rather than looks.'''
inproc = '''
Read the window from INSIDE the program that owns it. The only way to get the contents of a list box, a tree or a file list: those are unreachable from outside on this machine, at any speed. Costs more and is refused for the shell and the system processes, so ask for it when you need a list's rows and not otherwise. It never falls back quietly -- if it is refused you are told, because the ordinary answer would be missing exactly what you asked for.'''
target = '''
With `inproc`, a selector for a window belonging to the program to read. Defaults to whatever is in front.'''
items = '''
With `inproc`, read the rows of lists and trees. On by default, since it is the reason to use it.'''


[click]
description = '''
Click one control on the machine, named by the `sel=` value that `ui` reported for it.

If more than one control matches, nothing is clicked and you are told how many -- pick one deliberately by adding `:nth(2)` to the selector rather than hoping. The click is a real mouse click at the control's position, and it is refused if something else is covering it.'''

[click.args]
target = '''
The selector, copied from the `sel=` field of the control you want. For example `[class="#32770"] > Button[text="OK"]`.'''
double = '''
Double-click instead of single. For opening an icon in a list.'''
settle = '''
After clicking, wait for the screen to stop changing for this many milliseconds. Saves a round trip when the click opens a dialog you are about to read.'''

[keys]
description = '''
Type text on the machine, into a named control or into whatever has focus.

This is real typing, one key at a time, so it goes wherever the keyboard would. After clicking a text box, call this with no target.'''

[keys.args]
text = '''
The text to type. Plain characters plus Tab, Enter, Escape and the arrow keys.'''
target = '''
Optional selector for the control to type into; it is focused first. Leave empty to type into whatever has focus.'''
settle = '''
After typing, wait for the screen to stop changing for this many milliseconds.'''

[focus]
description = '''
Bring a window to the front.

You rarely need this: `click` and `keys` already bring a window forward when they have to. Use it when pressing something would be wrong -- most often before `shot`, when the window you want to photograph is behind another one.

It makes the window active, which takes the keyboard away from whoever is sitting at the machine. There is no way to raise a window quietly on this system.'''

[focus.args]
target = '''
Selector for a control in the window to raise. The window that contains it comes forward; you do not have to name the window itself.'''
settle = '''
After raising it, wait for the screen to stop changing for this many milliseconds.'''

[shot]
description = '''
Take a picture of the machine's screen.

Use it when `ui` comes back with nothing useful -- a program that draws its own interface, a game, an installer that is one big window -- or when you need to see what something looks like rather than what it is called. For finding and clicking a control, `ui` is cheaper and exact.'''

[shot.args]
x = '''
Left edge of the area to capture. Default 0.'''
y = '''
Top edge. Default 0.'''
w = '''
Width of the area, from `x`. Default 0, meaning the whole screen.'''
h = '''
Height of the area, from `y`. Default 0, meaning the whole screen.'''

# What a refusal from the machine means, in words rather than a status code.
# The model reads these and has to know what to do next, so every one says
# that. Keyed by the status the guest sends in its UIEND.
[ui.refused]
ambiguous = '''
More than one control matches that selector, so nothing was done. Add :nth(n) to pick one deliberately -- the count is above.'''
not_found = '''
Nothing on screen matches that selector. Read the screen again: it may have changed, or the window may not be open. Note that this program's own window never matches anything -- it is not on screen as far as these tools are concerned.'''
truncated = '''
The screen could not be read all the way through in the time allowed, so this answer may be incomplete. Narrow the scope, or try again.'''
bad_selector = '''
That selector does not parse.'''
no_target = '''
No control was named.'''
refused_self = '''
That control belongs to this program's own window, which it will not click or type into.'''
occluded = '''
That control is covered by another window even after its own window was brought to the front, so nothing was clicked -- the click would have landed on whatever is on top. What is on top: {on_top}. Move or close that window, or click something in it instead.'''
not_foreground = '''
The window would not come to the front, so nothing was typed -- it would have gone somewhere else.'''
no_window = '''
That window is gone.'''
no_text = '''
No text was given.'''
no_memory = '''
The machine ran out of memory doing that.'''
busy = '''
The machine is already doing something on screen. Try again.'''
stopping = '''
The machine is shutting down.'''
timeout = '''
The machine did not answer in time.'''
disconnected = '''
The machine disconnected.'''
inproc_unavailable = '''
The in-process reader could not be set up on this machine.'''
denied = '''
That program may not be read from the inside -- it is the shell or a system process, and there is no override. Read it from the outside instead, without `inproc`.'''
no_dll = '''
The in-process reader is not installed on that machine.'''
hook_refused = '''
The machine would not let us into that program.'''
no_reply = '''
We got into that program and it never answered. Read it from the outside instead, without `inproc`.'''
unknown = '''
The machine refused: {status}.'''

# Lines the model reads in a tree listing. The warnings come FIRST in the
# output, because a short list read as a complete one is how an agent
# concludes a control is not there.
[ui.view]
empty = '''
Nothing on screen answered. Either no windows match, or this program draws itself rather than using controls -- try `shot`.'''
incomplete = '''
! The screen could not be read all the way through in the time allowed. This list is incomplete.'''
at_limit = '''
! Stopped at the {n}-control limit. Narrow the scope or raise max_nodes.'''
dropped = '''
! {n} control(s) would not fit and were left out.'''
too_deep = '''
! {n} nested control(s) were deeper than the walk follows.'''
self_hidden = '''
! {n} window(s) of this program itself are not listed and never will be. You cannot read, click or type into your own interface -- the window you send messages through, its transcript and its buttons. Do not go looking for it.'''
no_image = '''
Captured {w}x{h} at {bpp}bpp, {size} bytes, but this bridge cannot convert it to an image.'''
bad_character = '''
That text contains a character this machine's character set cannot represent, so nothing was typed.'''
cannot_drive = '''
This machine cannot be driven from here.'''
bad_scope = '''
Unknown scope {scope}; use desktop, foreground or pid.'''
clicked = '''
Clicked {target}.'''
focused = '''
Brought the window containing {target} to the front.'''
typed = '''
Typed {n} characters into {where}.'''
