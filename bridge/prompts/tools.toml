# What the model is told each tool is for.
#
# These ship on EVERY request, so they are the most expensive prose in the
# project and the most load-bearing. No operating system and no shell is
# named in any of them: the schema goes to every machine, and which shells
# exist is a fact about one -- the system prompt names them from what that
# machine reported (see bridge/prompts/machine.toml and audit 02.5).


[exec]
description = '''
Run a command on the connected machine (the old computer the user is sitting at), and return its output. By default the command runs through the system shell, whichever that machine has. Output is captured as the console codepage and capped at 32KB. The user must approve every call on their own screen, so prefer one command that answers the question over several that explore.

ONE COMMAND PER CALL. Whether commands can be chained, and with what, depends on the shell that machine has -- the system prompt says which one it is and what it accepts. To run several steps regardless of shell, write a script file into the mirrored folder and run that; it is also one approval instead of several.

IMPORTANT: the command must be non-interactive. Anything that stops to ask a question -- a delete or a format asking 'Are you sure (Y/N)?' -- will HANG until the timeout kills it: that prompt is read from the machine's own console and there is no way to answer it from here -- NOT by piping one in either, which was measured and does not work. Use a form that does not ask: a switch that says yes, or a more specific target.'''

[exec.args]
command = '''
The command line to run, written for the target machine's own shell and path conventions -- the system prompt says what those are.'''
timeout_ms = '''
How long to allow, in milliseconds. Default {default_timeout_ms}, clamped to {max_timeout_ms}. The machine is slow; a compile may genuinely need minutes.'''
shell = '''
Which of the connected machine's shells to run the command through. The system prompt lists the ones it has; omit this to use the first of them. Pass "none" to spawn a program directly instead, which gives cleaner quoting but loses built-ins, pipes and redirection.'''
cwd = '''
Working directory on the connected machine. Optional -- leave it out and the command runs in this conversation's own folder on that machine, which is where your files arrive.'''

[sync_status]
description = '''
Report the state of file synchronisation with the connected machine: which of your files could not be copied there and why, which are in conflict, and which are currently refusing your writes.

Read this when a file you wrote does not seem to have arrived, before concluding that it did. Writing a file always succeeds here; whether it reached the user's machine is a separate question and this is the only way to answer it. Read-only and cheap to call.'''

[sync_resolve]
description = '''
Resolve one halted synchronisation decision, after the user has confirmed they are finished with the file.

When you and the user both change the same file, their copy wins and yours is moved aside -- and the path then REFUSES your writes, mechanically, until this is called. That is deliberate: you cannot usefully react to a conflict during the turn in which it happened, so the bridge stops you rather than asking you to stop.

Do not call this to make an error go away. Call it once you have read the preserved copy, merged what you need, and the user has said they have finished with the file. The user approves every call on their own screen.'''

[sync_resolve.args]
action = '''
release (default) -- lift the write refusal on this path, having merged; accept-revert -- the user really did undo your change, so take their version and discard yours; accept-tree -- answers a whole-pass refusal, takes no path; forget -- stop tracking a path that is gone from both sides and should not come back.'''
