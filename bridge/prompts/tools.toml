# What the model is told each tool is for.
#
# These ship on EVERY request, so they are the most expensive prose in the
# project and the most load-bearing. No operating system and no shell is
# named in any of them: the schema goes to every machine, and which shells
# exist is a fact about one -- the system prompt names them from what that
# machine reported (see bridge/prompts/machine.toml and audit 02.5).


[exec]
description = '''
Run one command on the connected machine (the old computer the user is sitting at) and return its output, through that machine's system shell by default. Output is capped at 32KB. The user approves every call on their own screen, so prefer one command that answers the question over several that explore.

To see or end running programs use `ps` and `kill`, not a command: the machine may have no command for that at all.

To read, write or list files use `get_file`, `put_file` and `list_dir`: through the shell, anything that is not plain text is mangled and long output is cut short.

ONE COMMAND PER CALL. Whether commands chain, and with what, is the shell's business -- the system prompt says which shell this machine has, and names the note that says what it accepts. For several steps, write a script into the mirrored folder and run that; it is also one approval instead of several.

The command must be non-interactive. Anything that stops to ask ('Are you sure (Y/N)?') HANGS until the timeout kills it -- that prompt is read on the machine's own console and cannot be answered from here, not even by piping one in. Use a switch that says yes, or a narrower target.'''

[exec.args]
command = '''
The command line, written for that machine's own shell and path conventions; the system prompt says what those are.'''
timeout_ms = '''
How long to allow, in milliseconds. Default {default_timeout_ms}, clamped to {max_timeout_ms}. The machine is slow; a compile may genuinely need minutes.'''
shell = '''
Which of the machine's shells to run through. The system prompt lists the ones it has; omit this for the first. "none" spawns the program directly: cleaner quoting, no built-ins, pipes or redirection.'''
cwd = '''
Working directory on the machine. Omit it to run in this conversation's own folder there, which is where your files arrive.'''

# Added to a result, not the tool description: read only when they apply.
[exec.notes]
# A command that failed to start when the machine reported no shell, so it
# was spawned as a program: `ver` fails with nothing saying why otherwise
# (BACKLOG 17).
no_shell = '''
The machine reported no shell, so this ran as a program directly: shell built-ins (dir, ver, copy) and redirection cannot work. Name a program by its path.'''
# THE ONE THING THIS SHELL COULD NEVER SAY. `command.com /c` exits 0 whatever
# happened, so until 2026-10-02 a failed compile and a clean one were
# indistinguishable from here and the agent had to go and look. The wrapper in
# bridge/services/execwrap.py recovers zero-versus-non-zero; this is how it is
# reported. Said only on failure -- on success the output is the answer and a
# sentence claiming it worked is a line in every prompt saying nothing.
# ONE LINE. An earlier version spent a paragraph explaining that a non-zero
# exit means the command failed and that the output might look fine anyway --
# both of which the reader can work out, and the second of which the shell's own
# note already says. 205 characters to say "it failed".
failed = '''
Non-zero exit status: this failed.'''

[sync_status]
description = '''
Report the state of file synchronisation with the connected machine: which of your files could not be copied there and why, which are in conflict, and which are refusing your writes.

Writing a file always succeeds here; whether it reached the user's machine is a separate question, and this is the only way to answer it. Read-only and cheap.'''

[sync_resolve]
description = '''
Resolve one halted synchronisation decision, after the user has confirmed they are finished with the file.

When you and the user both change the same file, their copy wins, yours is moved aside, and the path REFUSES your writes until this is called.

Do not call it to make an error go away: call it once you have read the preserved copy and merged what you need.'''

[sync_resolve.args]
action = '''
release (default) -- you have merged; lift the write refusal. accept-revert -- the user really did undo your change: take theirs, discard yours. accept-tree -- answers a whole-pass refusal, takes no path. forget -- stop tracking a path gone from both sides for good.'''

[ui]
description = '''
Read the controls on the machine's screen: windows, buttons, text boxes, menus, and what they say. One line per control, with a `sel=` selector to pass to `click` and `keys`.

Prefer this over `shot`: far cheaper, exact, and it gives you something you can click. Reach for `shot` when this comes back with almost nothing, which means the program draws itself rather than using controls.

Start with `scope="foreground"`, the window the person is looking at, and widen to `desktop` only to find something else.'''

[ui.args]
scope = '''
`foreground` for the active window and its controls, `desktop` for everything on screen, or `pid` with a process id. Default `desktop`.'''
pid = '''
With `scope="pid"`, the process to read. From the process list.'''
max_nodes = '''
Stop after this many controls. Default 400. A busy desktop is around 80; a file list can be thousands, and reading all of them is slow.'''
msaa = '''
Also ask the accessibility layer for each control's name, state and default action. OFF by default and worth leaving off: one call into another program per control, costing roughly as much as everything else put together. Turn it on to read whether a checkbox is ticked, or for a control with no text of its own.'''
hidden = '''
Include windows that are not on screen. Off by default, and not merely for speed: asking about a hidden window can bring it to life -- the Start menu once ended up painted on screen with nothing owning it.'''
wait_for = '''
A selector to wait for before reading. Use this instead of reading, finding nothing and reading again: the machine is slow and a dialog takes a moment to appear. It watches rather than polls, so it costs almost nothing.'''
wait_ms = '''
How long `wait_for` may wait, in milliseconds. Default 5000.'''
settle_ms = '''
Wait for the screen to stop changing for this many milliseconds before reading. For right after a click, while a window is still being drawn. It watches rather than looks, so it costs nothing.'''
inproc = '''
Read the window from INSIDE the program that owns it. The only way to get the rows of a list box, a tree or a file list -- unreachable from outside on this machine, at any speed. Costs more and is refused for the shell and the system processes, so ask for it when you need a list's rows and not otherwise. It never falls back quietly: if it is refused you are told.'''
target = '''
With `inproc`, a selector for a window belonging to the program to read. Defaults to whatever is in front.'''
items = '''
With `inproc`, read the rows of lists and trees. On by default, since it is the reason to use it.'''


[click]
description = '''
Click one control on the machine, named by the `sel=` value that `ui` reported for it.

If more than one control matches, nothing is clicked and you are told which ones -- narrow the selector with the window they are in. It is a real mouse click at the control's position, refused if something else covers it.'''

[click.args]
target = '''
The selector, copied from the `sel=` field of the control you want, or written by hand: `[class="#32770"][text~="save*"] Button[text~="ok"]`. `~=` matches ignoring case and the `&` of a mnemonic, with `*` and `?` as wildcards; a space means "anywhere inside".'''
double = '''
Double-click instead of single. For opening an icon in a list.'''
settle = '''
After clicking, wait for the screen to stop changing for this many milliseconds. Saves a round trip when the click opens a dialog.'''

[keys]
description = '''
Type text on the machine, into a named control or into whatever has focus.

This is real typing, one key at a time, so it goes wherever the keyboard would. After clicking a text box, call this with no target.'''

[keys.args]
# IT USED TO SAY "plus Tab, Enter, Escape and the arrow keys", which was a
# promise the implementation could not keep: an arrow key is not a character and
# there was no syntax for one. An agent clearing a text box sent
# `[Delete][Delete][Delete][Delete]Tiberiu`, got `John[Delete][Delete][D` in the
# box, and was told "Typed 39 characters" (2026-10-02). The brackets are real
# now; this says so.
text = '''
Characters to type, with named keys in square brackets: `Hello[Tab]world[Enter]`, `[Alt+F4]`, `[Home][Shift+End][Delete]` to clear a text box. Backspace, Tab, Enter, Escape, Space, Delete, Insert, Home, End, PageUp, PageDown, the arrows and F1-F12, each taking `Ctrl+`, `Alt+` and `Shift+`. To type a bracket, double it: `[[` gives `[` and `[[Delete]` gives the text `[Delete]`. A closing `]` is only special inside a name, so it needs no escape. An unknown name types nothing and says so.

Ctrl+A is NOT select-all in this machine's text boxes -- measured, it does nothing. To replace what is there, select it with `[Home][Shift+End]` and type over it.'''
target = '''
Optional selector for the control to type into; it is focused first. Leave empty to type into whatever has focus.'''
settle = '''
After typing, wait for the screen to stop changing for this many milliseconds.'''

[focus]
description = '''
Bring a window to the front.

Rarely needed: `click` and `keys` already raise a window when they have to. Use it when pressing something would be wrong -- most often before `shot`, when the window you want to photograph is behind another one.

It makes the window active, taking the keyboard away from whoever is sitting at the machine; there is no way to raise a window quietly on this system.'''

[focus.args]
target = '''
Selector for a control in the window to raise. The window containing it comes forward; you need not name the window itself.'''
settle = '''
After raising it, wait for the screen to stop changing for this many milliseconds.'''

[shot]
description = '''
Take a picture of the machine's screen.

Use it when `ui` comes back with nothing useful -- a program that draws its own interface, a game, a one-window installer -- or when you need to see what something looks like rather than what it is called. For finding and clicking a control, `ui` is cheaper and exact.'''

[shot.args]
x = '''
Left edge of the area to capture. Default 0.'''
y = '''
Top edge. Default 0.'''
w = '''
Width of the area, from `x`. Default 0, meaning the whole screen.'''
h = '''
Height of the area, from `y`. Default 0, meaning the whole screen.'''

# What a refusal from the machine means, in words rather than a status code.
# The model reads these and has to know what to do next, so every one says
# that. Keyed by the status the guest sends in its UIEND.
[ui.refused]
ambiguous = '''
Multiple results found, so the control can't be uniquely identified and nothing was done. Narrow the selector with an ancestor -- the window it is in, written before it with a space: `[class="#32770"][text~="save as*"] Button[text~="ok"]`. Use :nth(n) only as a last resort; it picks by position, and positions change when a window opens.'''
# The same, with the guest's list of WHICH controls matched. Each line carries
# a selector that names the control through its own window.
ambiguous_listed = '''
Multiple results found ({count}), so the control can't be uniquely identified and nothing was done. These matched:
{candidates}
Narrow the selector with an ancestor -- the window it is in, written before it with a space -- as suggested above. Use :nth(n) only as a last resort; it picks by position, and positions change when a window opens.'''
not_found = '''
Nothing on screen matches that selector. Read the screen again -- it may have changed, or the window may not be open. This program's own window never matches anything.'''
# WHICH PART was missing, when the selector has more than one. The message
# above was the only answer for `A > B`, and it reads as "the window is gone":
# an agent sent `HelloGuiClass[text="Hello Application"] > Button[text="Close"]`,
# was told the window might not be open, and believed it -- while the window was
# on screen and the program simply had no Close button (2026-10-02). The guest
# sends the index of the part that matched nothing; the text comes from the
# selector the caller sent.
not_found_part = '''
Nothing matches `{part}`, which is the part of that selector that was not found -- the rest of it did match. Read the screen again and check that control exists; do not assume the window is gone.'''
truncated = '''
The screen could not be read all the way through in the time allowed, so this answer may be incomplete. Narrow the scope, or try again.'''
bad_selector = '''
That selector does not parse.'''
no_target = '''
No control was named.'''
refused_self = '''
That control belongs to this program's own window, which it will not click or type into.'''
occluded = '''
That control is covered by another window even after its own window was brought to the front, so nothing was clicked -- the click would have landed on whatever is on top. What is on top: {on_top}. Move or close that window, or click something in it instead.'''
not_foreground = '''
The window would not come to the front, so nothing was typed -- it would have gone somewhere else.'''
no_window = '''
That window is gone.'''
no_text = '''
No text was given.'''
# NOTHING WAS TYPED, said first, because the alternative the agent will assume
# is that some of it went in. The whole string is checked before the first
# keystroke for exactly that reason.
bad_key = '''
`{key}` is not a key this knows, so NOTHING was typed. Named keys are Backspace, Tab, Enter, Escape, Space, Delete, Insert, Home, End, PageUp, PageDown, the four arrows and F1-F12, with optional `Ctrl+`, `Alt+` and `Shift+`. Write `[[` for a literal bracket.'''
no_memory = '''
The machine ran out of memory doing that.'''
busy = '''
The machine is already doing something on screen. Try again.'''
automation_off = '''
Screen control is turned off on that machine, so nothing was done and nothing will be. This is a setting the person at the keyboard chose, not a fault and not something to retry or work around -- tell them it is off if it matters, and do the rest of the work without the screen.'''
stopping = '''
The machine is shutting down.'''
timeout = '''
The machine did not answer in time.'''
disconnected = '''
The machine disconnected.'''
inproc_unavailable = '''
The in-process reader could not be set up on this machine.'''
denied = '''
That program may not be read from the inside -- it is the shell or a system process, and there is no override. Read it from the outside instead, without `inproc`.'''
no_dll = '''
The in-process reader is not installed on that machine.'''
hook_refused = '''
The machine would not let us into that program.'''
no_reply = '''
We got into that program and it never answered. Read it from the outside instead, without `inproc`.'''
unknown = '''
The machine refused: {status}.'''

# Lines the model reads in a tree listing. The warnings come FIRST in the
# output, because a short list read as a complete one is how an agent
# concludes a control is not there.
[ui.view]
# Ctrl+A is not select-all on this machine: measured twice on 2026-10-02,
# on a custom Win32 edit control and on Notepad, where `[Ctrl+A]goodbye`
# against a box holding "hello" gave "hellogoodbye". Said on the RESULT
# because the ARGUMENT description already said it and the agent used
# Ctrl+A anyway, in the session this was added for.
ctrl_a = '''
Note: Ctrl+A is not select-all on this machine and did nothing. To replace what is in a box, select it with `[Home][Shift+End]` and type over that.'''
empty = '''
Nothing on screen answered. Either no windows match, or this program draws itself rather than using controls -- try `shot`.'''
incomplete = '''
! The screen could not be read all the way through in the time allowed. This list is incomplete.'''
at_limit = '''
! Stopped at the {n}-control limit. Narrow the scope or raise max_nodes.'''
dropped = '''
! {n} control(s) would not fit and were left out.'''
too_deep = '''
! {n} nested control(s) were deeper than the walk follows.'''
self_hidden = '''
! {n} window(s) of this program itself are not listed and never will be. You cannot read, click or type into your own interface -- the window you send messages through, its transcript and its buttons. Do not go looking for it.'''
no_image = '''
Captured {w}x{h} at {bpp}bpp, {size} bytes, but this bridge cannot convert it to an image.'''
bad_character = '''
That text contains a character this machine's character set cannot represent, so nothing was typed.'''
cannot_drive = '''
This machine cannot be driven from here.'''
bad_scope = '''
Unknown scope {scope}; use desktop, foreground or pid.'''
# BOTH DIRECTIONS, because both were silent. `scope: "pid"` with no pid read
# as "no filter" and returned the whole desktop; a pid passed with any other
# scope was ignored. Each told the agent it had asked for something it had not.
pid_needed = '''
`scope: "pid"` needs a `pid`, and 0 is not one. Run `ps` to get the process
id you want, then ask again -- or use `scope: "foreground"` for whatever the
user is looking at, or `scope: "desktop"` for everything.'''
pid_unused = '''
You passed `pid: {pid}` with `scope: "{scope}"`, which ignores it. Use
`scope: "pid"` to look at one process, or drop the `pid`.'''
target_unused = '''
`target` only means something with `inproc: true`, which reads the rows of one
program's lists and trees. Without it the tree is read from `scope`, and the
`target` would have been ignored. Add `inproc: true`, or drop the `target`.'''
clicked = '''
Clicked {target}.'''
focused = '''
Brought the window containing {target} to the front.'''
# KEYSTROKES, not characters. `[Enter]` is one keypress and seven characters,
# and saying "characters" meant the agent could not tell how many keys had
# actually gone in -- `[Down][Down][Down][Down][Down][Down][Enter]` reported 43.
typed = '''
Sent {n} keystrokes to {where}.'''


[ps]
description = '''
List the programs running on the connected machine: process id (hex), parent id, thread count and program path. For finding a program that has hung, or seeing what a command left running; it works while a command is still running, so you can look for what is stuck. Changes nothing.'''

[ps.view]
truncated = '''
(The list was cut short; it had more processes than one reply carries.)'''

# A refusal or failure from `ps` or `kill`, in words. {pid} is the id asked
# about, {status} the guest's own word for an unknown one.
[ps.refused]
unavailable = '''
Processes cannot be listed or ended: this conversation is not attached to a machine that answers for them.'''
no_toolhelp = '''
That machine cannot list or end processes (it has no process-snapshot API -- Windows NT 4 is like this). Use `exec` to run the machine's own tools instead, if it has any.'''
no_memory = '''
The machine had no memory to build the list. Try again in a moment.'''
bad_pid = '''
"{pid}" is not a process id. Use the hex id exactly as `ps` shows it.'''
no_such_pid = '''
There is no process {pid}. It has ended, or the id is wrong -- run `ps` again; ids change.'''
denied = '''
Refused: process {pid} is protected. The machine's own system processes are never ended; Explorer and 16-bit programs are refused unless you pass `force` -- and only do that if the user asked for it, since ending them can leave the machine unusable until it restarts.'''
dos_session = '''
Refused: process {pid} runs a DOS session (a console window or a DOS program). On this machine ending it leaves that session stuck in memory until a restart, and a machine carrying stuck sessions has crashed. Let it finish, close it from its own window, or -- only if the user asks for it -- pass `force`.'''
failed = '''
The machine refused to end process {pid}.'''
timeout = '''
The machine did not answer in time. It may be busy; try again.'''
disconnected = '''
The machine disconnected before it answered.'''
unknown = '''
The machine answered "{status}" for process {pid}, which this bridge does not recognise.'''

[kill]
description = '''
End one program on the connected machine, by the hex process id `ps` shows. For a program that has hung or that a command left running. The user approves every call. Some processes are protected and refused.'''

[kill.args]
pid = '''
The process id, in hex, exactly as `ps` shows it.'''
force = '''
Also end Explorer, a 16-bit program, or a program running a DOS session, which are refused otherwise. Only when the user has asked for it.'''

[kill.view]
ok = '''
Process {pid} has ended.'''
pending = '''
Process {pid} was told to end and is still there after a moment. Some programs take a while; run `ps` again to see whether it has gone. On Windows 98 a DOS program's session can take up to half a minute, and some parts of it never go until the machine restarts.'''

# --- files on the connected machine, outside the mirrored folder ------------
#
# These three exist because `exec` does those jobs badly, which is the bar in
# CLAUDE.md. Listing a directory is NOT here: the machine's own shell does
# that well, and a tool that duplicates it costs context on every request for
# nothing.

[fs.refused]
unavailable = '''
No machine is connected, so there is nothing to read or write.'''
bad_path = '''
The machine refused "{path}" as a path it can use.'''
too_long = '''
The path "{path}" is longer than this machine's filesystem allows.'''
missing = '''
There is nothing at "{path}" on the machine.'''
is_directory = '''
"{path}" is a folder, not a file.'''
not_a_directory = '''
"{path}" is a file, not a folder, so there is nothing to list. Its size and date are in the listing of the folder it is in.'''
locked = '''
"{path}" could not be read or written just now -- another program on the machine is probably holding it. Worth trying again.'''
readonly = '''
"{path}" is write-protected on the machine.'''
no_parent = '''
The folder that would hold "{path}" does not exist on the machine.'''
no_space = '''
The machine's disk is full.'''
out_of_order = '''
The transfer arrived out of order and nothing was written. Try again.'''
crc_mismatch = '''
The bytes that arrived do not match the bytes that were sent, so nothing was kept. Try again.'''
busy = '''
Another file transfer is already running. Wait for it and try again.'''
timeout = '''
The machine did not answer in time. It is slow, and a large file over a slow link can take minutes.'''
disconnected = '''
The machine disconnected before the transfer finished.'''
unknown = '''
The machine answered "{status}" for "{path}", which this bridge does not recognise.'''

[get_file]
description = '''
Read a file from anywhere on the connected machine, by its full path, including outside the folder your files are mirrored into. Prefer it to printing a file through the shell, which mangles anything that is not plain text and truncates it.

SHORT TEXT comes back inline, with the endings you are used to and a note saying which endings the file has on that machine -- the one thing you cannot see by looking. ANYTHING ELSE -- a long file, or any file that is not text -- is downloaded to this proxy and the reply gives only the path. Read it with your own file tools, which can seek and search; this one does not take a line range because they already do it better.'''

[get_file.args]
path = '''
The full path on the connected machine, written the way that machine writes paths.'''
max_bytes = '''
Stop after this many bytes; the machine enforces it while reading, so a huge file costs only what you asked for. There is a ceiling in any case and the reply says when either one bit. It does not change what comes back inline -- a long file is downloaded whether or not you cap it.'''
# RESIDENT, so two sentences. The second is the only part that is load-bearing:
# it names the cases where off is the right answer, which is a short list.
translation = '''
Omit it. False returns the bytes exactly as they are on that machine, saved to a local file rather than shown.'''

[get_file.view]
# WHAT IT IS, HOW BIG, AND WHERE. Said for a long text file and a binary
# alike: the path is what the agent acts on, and the type and size are what
# tell it whether to Read the thing, Grep it, or leave it alone.
downloaded = '''
{kind}, {size}. Downloaded to:
  {local}'''
truncated = '''

(Stopped early -- there is more of this file on the machine.)'''
# SAID EVERY TIME, not only when it is surprising. On 2026-10-01 an agent read
# a batch file back specifically to find out why COMMAND.COM would not run it,
# got text that looked exactly right, and learned nothing: LF and CRLF render
# identically. It took a separate controlled experiment to recover the one word
# this line now carries.
endings = '''
(On that machine this file has {kind}.)'''

[get_file.endings]
native = '''{eol} line endings, this machine's own'''
# The CONSEQUENCE of the wrong endings lives in the shell's note, where it is
# measured and fetched once, rather than in a line printed on every read.
foreign = '''{eol} line endings, NOT the {want} this machine uses'''
none = '''no line endings'''
binary = '''NUL bytes, so it is binary'''
irregular = '''irregular line endings (lone CR, CR CR LF, or mixed), converted in neither direction'''
[get_file.eol]
lf = '''LF'''
crlf = '''CRLF'''
cr = '''CR'''

[put_file]
description = '''
Write a file to anywhere on the connected machine, by its full path, including outside the folder your files are mirrored into. Nothing else can: the shell writes only plain short text, and the mirrored folder reaches one place.

It overwrites whatever is there. The user approves every call and sees the destination, so say what you are replacing and why. Write into a folder, never the top level of a drive.'''

[put_file.args]
path = '''
The full path on the connected machine, written the way that machine writes paths. Anything already there is replaced.'''
content = '''
The text to write. For anything that is not text, write it to a file in your own folder first and pass `from_path` instead.'''
from_path = '''
A file in your own folder to send. Use this for anything that is not text. Relative to your folder; nothing outside it can be sent.'''
# RESIDENT. The first sentence has to be enough on its own, because the agent
# that most needs this is the one that did not read past it.
translation = '''
Omit it: text gets that machine's line endings and character set. False sends the bytes exactly as given. Files containing NUL are never converted either way.'''

[put_file.refused]
one_source = '''
Pass either `content` or `from_path`, not both and not neither.'''
from_path = '''
"{path}" is not a file in your own folder. `from_path` is relative to that folder and cannot reach outside it.'''
# A REFUSAL, NOT AN EXCEPTION. Until 2026-10-02 this case went out as a
# traceback: `fold.encode_exact` raises and the handler logged and re-raised,
# so one box-drawing character in a README was an error with no advice in it.
# The character is named because a 40KB file has one bad byte in it somewhere
# and the agent cannot find it by looking.
unencodable = '''
"{char}" ({code}) at character {at} is not in {cp}, that machine's character set, and an approximation would be a different file. Nothing was written. Replace it and try again.'''

[put_file.view]
wrote = '''
Wrote {bytes} bytes to {path} on the machine.'''
# Said when it happened, so the agent knows the file on that machine is not
# byte-identical to the one here -- and so a later `get_file` showing CRLF is
# not a mystery.
converted = ''' Line endings converted, so it is not byte-identical to your copy.'''

# WHY A TOOL AND NOT `dir`. The bar is CLAUDE.md's: a tool earns its place only
# if `exec` does the job badly. Measured on real Windows 98, twelve files in one
# directory (docs/measurements/batch-eol-and-dir-b-p200-20261001.txt):
#
#   dir /b <path>    131 bytes -- names, no sizes, no dates
#   dir    <path>    about 1,100 -- volume label, serial number, a directory
#                    header, `.` and `..`, a free-space footer, and BOTH the
#                    8.3 and the long name on every row
#
# Cheap or detailed, never both; neither machine-readable; both in the console
# codepage rather than the one long names are stored in; and a path with a space
# in it has to be quoted for a shell that splits on whitespace. A live session
# ran plain `dir` six times to check single files it had just compiled.
[list_dir]
description = '''
List one directory on the connected machine, by its full path, including outside the folder your files are mirrored into. Names, sizes, and which entries are folders.

One level: it does not descend. Prefer it to the shell's directory command, which costs several times as much for the same answer.'''

[list_dir.args]
path = '''
The full path of the directory, written the way that machine writes paths.'''
max_entries = '''
Stop after this many entries; the machine enforces it while reading. There is a ceiling in any case and the reply says when either one bit.'''

[list_dir.view]
header = '''{path}'''
dir = '''     <dir>'''
unknown = '''         ?'''
empty = '''
{path} is an empty directory.'''
# A CAPPED LISTING IS NOT A SHORT ONE. An agent that reads one as the whole
# directory has been told the rest of the files are gone.
truncated = '''
(Stopped at {count} entries -- NOT the whole directory. Raise `max_entries` for the rest.)'''

[drives]
description = '''
List the connected machine's drive letters, what kind each one is, and how much room is free.

Read-only and cheap for a hard disk or a network share. For a floppy or a CD-ROM it is cheap too UNLESS you set `probe` true: that asks the drive for its label and free space, which on real hardware means the drive seeks, takes a moment, and can retry if it is empty. Without `probe`, a removable drive's letter and kind still come back, just not what is in it -- call again with `probe` true if you need to know.'''

[drives.view]
no_media = '''empty'''
media_unknown = '''not checked'''

# THE ONE TOOL THAT TALKS TO NOBODY. Every other tool here reaches the
# connected machine; this one answers out of `bridge/profiles/*.toml`, the
# measured notes the system prompt used to carry in full.
#
# It exists because the prompt could not carry them. Rendered bodies,
# 2026-10-01: msvc 1,813 characters, watcom 964, jdk 957, cscript 804,
# shell 893, against a 2,800-character budget for the whole block -- so the
# old code rendered ONE toolchain note and dropped the rest in alphabetical
# order. On the machine this is built for that silently cost the Visual C++
# note, and with it the measured fact that `cl` prints nothing at all when a
# directory is missing from PATH.
#
# Kept honest against "the exec test" (docs/PLAN.md 3.1): `exec` cannot do
# this at all. There is nothing on the guest to run -- the knowledge is on
# the bridge, and the alternative to a tool is resident text that does not
# fit.
[toolnote]
description = '''
What is actually known about one tool installed on the connected machine -- measured on a real machine of that era, not quoted from its documentation.

The system prompt already says what each installed tool IS; this says how to drive it here. Call it for the tool you have chosen, before your FIRST build, compile or script command with it -- and for the shell before your first command of any kind, since every command goes through it. These notes are mostly about commands that FAIL WHILE LOOKING LIKE THEY SUCCEEDED -- empty output, exit code 0, a usage message -- so nothing will prompt you afterwards. One call holds for the conversation.

Reads nothing and runs nothing: free, instant, no approval.'''

[toolnote.args]
name = '''
The tool's name, spelled exactly as the inventory in the system prompt spells it.'''
# RESIDENT TEXT, so it is two sentences and not five. The default is the
# right one often enough that most calls should leave it out, and the second
# sentence is the only part that is load-bearing: it tells the model that an
# answer may be about a neighbouring release, which is what makes the
# disclosure in the body credible rather than surprising.
version = '''
Which release, like `1.1` or `6.0`. Omit it for the one the machine reported. The nearest measured note comes back, and says so when it is not the one you named.'''

[toolnote.view]
header = '''{title}, on the connected machine at `{path}`.
Measured: {measured}'''
# THE TWO DIRECTIONS FAIL DIFFERENTLY AND SAY DIFFERENT THINGS.
#
# `ahead` is the dangerous one: the machine is NEWER than anything measured,
# so the note's absences are absences of the past. The JDK note is a list of
# what Java 1.1 lacks, and read in front of a 1.3 install half of it came
# back -- collections, Swing -- so an agent that believes it writes 1998 Java
# on a 2000 machine and never finds out it did not have to. Until this
# existed the only defence was refusing to detect 1.2+ at all.
#
# `behind` is the loud one: the note documents a later release, so what it
# tells you to use may simply not be there, and the compiler says so on the
# first build. Still disclosed -- an agent that knows why a symbol is missing
# spends one round trip, and one that does not goes hunting the disk.
#
# BOTH NAME BOTH NUMBERS. "This note may not match your version" is not a
# disclosure; it is a disclaimer, and a model cannot act on it.
ahead = '''THIS IS NOT THE VERSION IN FRONT OF YOU. {asked} is {origin}; the newest release anybody has measured is {have}, and what follows is that one.

{asked} came AFTER {have}, so it has things this note describes as absent. Read every absence below as "absent in {have}", never as "absent on this machine", and confirm with one command anything you are about to work around. The paths, flags and failure modes are still the best information there is -- they are just older than the machine.'''
behind = '''THIS IS NOT THE VERSION IN FRONT OF YOU. {asked} is {origin}; the nearest release anybody has measured is {have}, and what follows is that one.

{have} came AFTER {asked}, so anything this note tells you to use may not exist yet on the machine you are driving, and the error you get will name a missing symbol rather than the era it came from. Confirm before depending on it.'''
# TIER 2, AND IT IS DELIBERATELY NOT THE BANNER. Same major.minor, different
# patch release: 1.1.3 answering a 1.1.8 machine. The facts are about the same
# generation of the tool, so shouting here would spend the warning that tier 3
# needs -- the 1.1-note-in-front-of-a-1.3-machine case, which is why jdk.toml
# refused to detect 1.2+ at all before any of this existed.
#
# Said out loud all the same, because `Measured:` is the agent's whole basis
# for acting without checking. The claim is kept narrow on purpose: it says
# what IS warranted (same line, same era) and what is not (nobody ran these
# commands on the version in play), rather than reassuring.
patch = '''A PATCH RELEASE APART, not a generation: this was measured on {have}, and {asked} is {origin}. Both are {line}, so nothing below is about a different era of the tool -- but nobody has run these commands on {asked}, and a build number or a path under the root may have moved.'''
origin_asked = '''what you asked about'''
origin_reported = '''what the machine reports'''
bad_version = '''`{version}` is not a version number this could place, so it was ignored and what follows is the note you would have got without it. Versions measured for `{name}`: {versions}.'''
versions_none = '''none, this note is not filed by version'''
unknown = '''There is no tool called `{name}` on that machine, or at least detection did not find one. These were found and have notes: {known}.'''
no_note = '''`{name}` was detected on that machine, but nobody has measured it, so there is no note -- and a guess here would be worse than silence. Notes exist for: {known}.'''
none_at_all = '''Nothing was detected on that machine, so there are no notes to read.'''
