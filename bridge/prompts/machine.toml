# sync is on, but this conversation has not committed to a folder yet
no_folder_yet = '''
Your file editing tools operate on `{workdir}` on this proxy.

**This conversation does not have a folder on the user's machine yet.** One is
created{under} the first time you use a tool, named after what the user asked
for, and you will be told its path -- on both machines -- in a notice at that
moment. Until then nothing is being copied in either direction, and that is
normal rather than a fault: a conversation that is only being talked to shares
no files. **Do not go looking for a synchronisation problem, and do not report
one.** Write in the folder the notice names, once it names one.'''

# sync is not configured at all. {declared} says whether the machine named a
# folder anyway -- it usually has -- and {where} names a destination, because
# an agent told only "nothing is mirrored" picked the root of C: (2026-10-01).
no_sync = '''
Your file editing tools operate on the working copy at `{workdir}` on this
proxy, which exists to stage files for the user's machine. Use them normally
within it. **These files are NOT copied to the connected machine on their
own** -- synchronisation is not switched on for this session, so nothing here
moves by itself.
{declared}

**One file at a time you can still move**, with `put_file`, which writes to a
path you name on the user's machine and needs no synchronisation. It is the
right answer for a handful of files and the wrong one for a folder: there is
no baseline, so nothing notices later edits on either side -- and no staged
copy either, so a file you replace over there is simply gone. Say which file
is going where and what it replaces, and let the user approve it.
{where}'''

# the machine shares a folder AND this conversation has its own folder inside
# it. The only sync-off case that hands the agent a destination, and the one
# the design always intended: the client creates a folder per conversation
# under the home the user configured, whether or not anything is mirrored.
no_sync_declared_folder = '''

**That machine shares `{home}`, and this conversation's own folder inside it
is `{folder}`.** The folders are real and they are on their disk; what is
missing is the copying, at this end. That is a configuration this session
cannot change, not a fault to diagnose -- do not go looking for a
synchronisation problem and do not report one.'''

# the two sides disagree: the machine named a share, this bridge has no mirror
no_sync_declared = '''

**That machine named `{home}` as the folder it shares, and this bridge is not
mirroring it.** The folder is real and it is on their disk; the copying is
what is missing, at this end. That is a configuration this session cannot
change, not a fault to diagnose -- do not go looking for a synchronisation
problem and do not report one.'''

# ... and when it named nothing, so there is no obvious destination either
no_sync_undeclared = '''

That machine named no shared folder either, so there is no agreed place on it
and nothing is being copied in either direction. That is the configuration,
not a fault -- do not go looking for a synchronisation problem.'''

# where a file put on the machine goes, when this conversation has a folder
no_sync_where_folder = '''

**USE `{folder}` AS YOUR WORKING DIRECTORY ON THAT MACHINE.** It belongs to
this conversation, it sits inside the folder the machine shares, and the
client creates it the first time you use a tool -- so if a tool call is the
first thing you do, it is being made as that call runs. Put files there,
make subdirectories there, and name the path in what you say so the user
