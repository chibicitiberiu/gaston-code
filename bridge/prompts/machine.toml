# prepended to the user's message, once, when a conversation commits to a
# folder on a machine this bridge is not mirroring.
#
# THE ONLY CHANNEL THAT ARRIVES IN TIME. The system prompt is built when the
# connection attaches, before the user has said anything -- so it cannot name
# a folder that is named from the conversation's title. The transcript notice
# is for the person at the keyboard and the agent never sees it. And nothing
# else reaches the agent between "the user asked for a file" and "the agent
# chose a path", which on 2026-10-01 was the root of C: on real hardware.
workdir_told = '''[Automatic message from the bridge, not from the user.]

**USE `{folder}` AS YOUR WORKING DIRECTORY ON THE CONNECTED MACHINE.** It is
this conversation's own folder, inside the folder that machine shares, and
that machine creates it the first time you use a tool -- so it is there by
the time you can write into it. Put the user's files there with `put_file`,
make subdirectories there, and say the path in what you report. **Never the
root of a drive.**

Nothing is mirrored in this session, so a file written here on the proxy
stays here however well the write appears to succeed. Moving it is a
`put_file` to a path you name.

--- the user's message follows ---

'''

# ... and when it named none, so the user has to be asked
no_sync_where_unknown = '''

**So ask where a file should go before you put one there.** **Never the root
of a drive.** `C:\YOURFILE.TXT` is not a destination: a drive root is the
user's own top-level disk, nothing sweeps it, and a scratch file dropped there
outlives the conversation that made it. Propose a folder, say why, and write
