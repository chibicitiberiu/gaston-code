# where a file put on the machine should land, when it named a folder
no_sync_where = '''

**This conversation gets its own folder under `{home}`, and that folder is
your working directory on that machine.** `{home}` is what their machine
shares; the folder inside it is named after what you were asked for and is
created by their machine the first time you use a tool on it. Its path
