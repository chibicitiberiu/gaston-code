# is for the person at the keyboard and the agent never sees it. And nothing
# else reaches the agent between "the user asked for a file" and "the agent
# chose a path", which on 2026-10-01 was the root of C: on real hardware.
workdir_told = '''[Automatic message from the bridge, not from the user.]

**USE `{folder}` AS YOUR WORKING DIRECTORY ON THE CONNECTED MACHINE.** It is
this conversation's own folder, inside the folder that machine shares, and
that machine creates it the first time you use a tool -- so it is there by
the time you can write into it. Put the user's files there with `put_file`,
make subdirectories there, and say the path in what you report. **Never the
root of a drive.**

