# The release build: four artefacts, one tag.
#
# WHAT THIS FILE IS AND IS NOT. Every piece of packaging logic lives in a
# script that runs on a developer's machine -- tools/gen/mkrelease.sh,
# mkwheel.sh and mkguide.py, which `make release` runs in order. This file
# installs the toolchains, calls them, and publishes what they produced.
# When a release is wrong it is wrong in one of those scripts, where it can
# be run again in four seconds instead of pushed and watched.
#
# THE FOUR:
#   gaston-<ver>-win98.zip                       the Windows 98 GUI client
#   gremote-<ver>-win98.zip                      the Win98 remote server
#   gaston_code_bridge-<ver>-py3-none-any.whl    the host half, every host
#   gaston-code-<ver>-guide.zip                  the user guide
#
# ONE WHEEL REPLACED THREE HOST ARTEFACTS -- an AppImage, a Windows zip and
# a container image. All three existed because claude-agent-sdk's platform
# wheels bundle Claude Code itself, so shipping the bridge meant shipping a
# quarter of a gigabyte. Installed from the SDK's sdist it is 449 KB of
# pure Python that runs the user's own CLI, and one py3-none-any wheel
# covers Linux, macOS and Windows -- more ground than the three covered
# between them, since macOS never had an artefact at all.
#
# SHA256SUMS IS WRITTEN HERE AND NOWHERE ELSE. No build script writes one,
# because each would cover only its own share and the merge would pick a
# winner in silence. The one below covers all four.
name: release

on:
  push:
    tags: ['v*']
  # So the whole thing can be exercised without cutting a release. Artefacts
  # are uploaded, nothing is published, and no image is pushed.
  workflow_dispatch:

permissions:
  contents: write          # the release job creates a GitHub release

env:
  # Open Watcom publishes a dated build monthly. Pinned, because the six
  # image budgets in win/Makefile are measured numbers and the compiler is
  # what produces them. Verified 2026-10-24: this build gives byte-identical
  # images to the development toolchain (a 2026-09-14 CI build) -- gaston
  # 495,616, gremote 262,656, gupdate 48,128, and all six committed-at-load
  # figures unchanged.
  OW_TAG: 2026-10-01-Build
  WATCOM: /opt/watcom

jobs:
  # ------------------------------------------------------------------------
  # The guest side, plus the gates. One job, because `make test-fast` needs
  # the client built and so needs the same toolchain.
  guest:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # ~150 MB, so cached on the pinned tag rather than fetched per run.
      - name: Cache Open Watcom
        id: ow-cache
        uses: actions/cache@v6
        with:
          path: /opt/watcom
          key: openwatcom-${{ env.OW_TAG }}

      - name: Install Open Watcom
        if: steps.ow-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          # ow-snapshot.tar.xz unpacks straight to a WATCOM root -- binl64,
          # h, lib386 and the rest at the top level -- so there is no
          # installer to drive and nothing to answer.
          curl -fsSL -o /tmp/ow.tar.xz \
            "https://github.com/open-watcom/open-watcom-v2/releases/download/${OW_TAG}/ow-snapshot.tar.xz"
          sudo mkdir -p "$WATCOM"
          sudo tar -xf /tmp/ow.tar.xz -C "$WATCOM"
          # ASSERT ON THE BANNER, NOT THE EXIT STATUS. wcc386 with no input
          # file prints its version and exits 1, which is correct and is
          # fatal under `set -euo pipefail` -- so this step failed on the
          # first run of this workflow that ever happened, immediately
          # after printing the line that proved the toolchain works. The
          # step only runs on a cache miss and the cache had never been
          # populated, so it would have failed on every run until this.
          VER=$("$WATCOM/binl64/wcc386" 2>&1 | sed -n '2p' || true)
          echo "$VER"
          case "$VER" in
            *Version*) ;;
            *) echo "::error::wcc386 did not run: $VER"; exit 1 ;;
          esac

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # PIP_NO_BINARY, so the gates run against the shape users get. With
      # the SDK's platform wheel installed, `_find_bundled_cli()` wins on
      # every machine the code is tested on and the bring-your-own-CLI path
      # is never once exercised by the people changing it -- which is
      # exactly how the bundled CLI came to be documented backwards in four
      # files. No runner has a `claude`, so the resolver's tests use fakes.
      - name: Install the gates' dependencies
        run: pip install -r requirements-dev.txt
        env:
          PIP_NO_BINARY: claude-agent-sdk

      # Ruff, mypy, the RichEdit grep, and the Python suite except the Wine
      # runs. wine-smoke is deliberately not here: it is eight minutes and a
      # Wine prefix, and what it proves -- that the C agrees with the Python
      # about the codec, the INI round-trip and the caps enums -- is not a
      # question a tag can change. It belongs in a CI workflow on push.
      - run: make lint
      - run: make test-fast

      - name: Version from the tag, or from the source on a manual run
        id: ver
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(sed -n 's/^#define RC_VER_STR  *"\([^"]*\)".*/\1/p' win/app/resource.h)
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "building $V"
          # The HOST version lives in pyproject.toml and the GUEST version in
          # win/app/resource.h. mkrelease.sh refuses a mismatch against the
          # guest's; this is the other half, so a tag cannot name a version
          # only one of the two halves reports.
          PY=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml | head -1)
          if [ "$PY" != "$V" ]; then
            echo "::error::pyproject.toml says $PY but this release is $V" >&2
            exit 1
          fi

      # Builds gaston, gremote and gupdate, runs `make check` -- the six
      # image caps and the NT-only import audit -- and writes the two zips.
      - run: ./tools/gen/mkrelease.sh --version "${{ steps.ver.outputs.version }}"

      # NAMED, not `*.zip`. The guide is a zip too, and an
      # extension-only glob here would sweep up anything else that ever
      # lands in this directory -- while `merge-multiple: true` below
      # flattens every artifact into one dist/, where a duplicate would
      # pick a winner silently.
      - uses: actions/upload-artifact@v7
        with:
          name: guest
          path: |
            build/release/gaston-${{ steps.ver.outputs.version }}-win98.zip
            build/release/gremote-${{ steps.ver.outputs.version }}-win98.zip
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # The bridge, as one wheel. No version input: the wheel is named from
  # pyproject.toml, and the guest job already refuses a tag that disagrees
  # with it -- so this job cannot be wrong about a number it never reads.
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # mkwheel.sh makes its own venv for `build`, then installs the wheel
      # into a second one and asks it for --help -- including a check that
      # the SDK beside it is the source build and carries no CLI.
      - run: ./tools/gen/mkwheel.sh

      # *.whl, NOT build/release/*. The build also emits an sdist, which is
      # a build artefact rather than a fifth release asset.
      - uses: actions/upload-artifact@v7
        with:
          name: bridge
          path: build/release/*.whl
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # The user guide. Deliberately NOT `needs: guest`: making the guide wait
  # on a 150 MB Open Watcom install, `make lint` and `make test-fast` is bad
  # enough, but it would also mean an image cap moving kills the guide build
  # for a reason the guide has nothing to do with.
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Its two dependencies directly, not requirements-dev.txt. Copying
      # the guest job's line would pull claude-agent-sdk and, under
      # PIP_NO_BINARY, build it from source -- so the guide could fail to
      # build because of the agent SDK, which it has nothing to do with.
      - run: pip install markdown==3.10 pillow==12.3.0

      - run: python3 tools/gen/mkguide.py

      - uses: actions/upload-artifact@v7
        with:
          name: guide
          path: build/release/*-guide.zip
          if-no-files-found: error

  # ------------------------------------------------------------------------
  # One release, four artefacts, one checksum file. Tags only: a manual run
  # has already uploaded everything as workflow artefacts, which is the
  # point of being able to run it manually.
  #
  # ONE CAVEAT ABOUT THE DRY RUN, because it is not obvious and it is
  # expensive to learn by doing: the workflow_dispatch ref picker accepts
  # TAGS as well as branches, so dispatching on v0.4.0 sets
  # `ref_type == 'tag'` and publishes for real. The dry run is only a dry
  # run from a branch.
  release:
    runs-on: ubuntu-latest
    needs: [guest, bridge, guide]
    if: github.ref_type == 'tag'
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: One SHA256SUMS over everything, generated here
        run: |
          set -euo pipefail
          cd dist
          # No build script writes one any more. mkrelease.sh used to, over
          # `*.zip`, which after the wheel joined the release would have
          # hashed the guide and silently MISSED the wheel -- .whl is not
          # *.zip. A sums file covering three of four assets is worse than
          # none, because it looks complete.
          rm -f SHA256SUMS
          sha256sum ./* | sed 's|\./||' | tee SHA256SUMS
          ls -la
          # Four assets, no more and no less. `merge-multiple: true`
          # flattens every artifact into this one directory, so a name
          # colliding between two jobs would pick a winner in silence.
          test "$(ls -1 | grep -vc '^SHA256SUMS$')" = 4

      # DRAFT AS WELL AS PRERELEASE, and draft is the one that matters.
      # `prerelease` publishes immediately with a label on it; `draft`
      # holds the release unlisted until somebody has read the asset list
      # and the generated notes. For the first run of a workflow that has
      # never executed -- make lint and make test-fast have never run on a
      # runner, and the Open Watcom cache key has never been populated --
      # that is the difference between a mistake you fix and a mistake
      # people have already downloaded.
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
          prerelease: true
          body: |
            First alpha. Read the guide before anything else.

            ## Downloads

            **Start here**
            - `gaston-code-${{ needs.guest.outputs.version }}-guide.zip` — how to set the whole thing up. Open `guide.html`; it reads in Internet Explorer 5 on the Windows 98 machine as well as in a modern browser.

            **On the Windows 98 machine**
            - `gaston-${{ needs.guest.outputs.version }}-win98.zip` — the GUI client. This is the one you want.
            - `gremote-${{ needs.guest.outputs.version }}-win98.zip` — optional, and a separate decision: it opens a port that lets another machine drive this one.

            **On the modern machine**
            - `gaston_code_bridge-${{ needs.guest.outputs.version }}-py3-none-any.whl` — Linux, macOS or Windows.

            ## Claude Code is a prerequisite

            The bridge runs the copy on your machine rather than carrying
            its own, so install it first and sign in:

            ```
            curl -fsSL https://claude.ai/install.sh | bash
            ```

            Then install the bridge with the SDK built from source, or you
            get a second 219 MB copy of Claude Code that is used in
            preference to yours:

            ```
            export PIP_NO_BINARY=claude-agent-sdk
            pipx install gaston_code_bridge-${{ needs.guest.outputs.version }}-py3-none-any.whl
            ```

            The guide explains both lines, and what to do when your Python
            is older than 3.11.

            Checksums for all four assets are in `SHA256SUMS`.
